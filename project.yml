name: ExpenseManager
options:
  bundleIdPrefix: com.nirmal
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  ExpenseManager:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ExpenseManager
        excludes:
          - "Tests/**"
    info:
      path: ExpenseManager/Info.plist
    entitlements:
      path: ExpenseManager/ExpenseManager.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nirmal.ExpenseManager
      SWIFT_VERSION: "6.0"
      SWIFT_STRICT_CONCURRENCY: complete
      INFOPLIST_FILE: ExpenseManager/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ENABLE_USER_SCRIPT_SANDBOXING: YES
      CODE_SIGN_ENTITLEMENTS: ExpenseManager/ExpenseManager.entitlements
    dependencies:
      - target: ExpenseManagerWidgets
        embed: true

  ExpenseManagerWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ExpenseManagerWidgets
    info:
      path: ExpenseManagerWidgets/Info.plist
      properties:
        CFBundleDisplayName: Expense Glance
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ExpenseManagerWidgets/ExpenseManagerWidgets.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nirmal.ExpenseManager.widgets
      SWIFT_VERSION: "6.0"
      CODE_SIGN_ENTITLEMENTS: ExpenseManagerWidgets/ExpenseManagerWidgets.entitlements
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  ExpenseManagerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ExpenseManager/Tests
    dependencies:
      - target: ExpenseManager
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nirmal.ExpenseManagerTests
      GENERATE_INFOPLIST_FILE: YES
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ExpenseManager.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ExpenseManager"
      BUNDLE_LOADER: "$(TEST_HOST)"

  ExpenseManagerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ExpenseManagerUITests
    dependencies:
      - target: ExpenseManager
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nirmal.ExpenseManagerUITests
      GENERATE_INFOPLIST_FILE: YES

schemes:
  ExpenseManager:
    build:
      targets:
        ExpenseManager: all
        ExpenseManagerWidgets: all
        ExpenseManagerTests: [test]
        ExpenseManagerUITests: [test]
    test:
      targets:
        - ExpenseManagerTests
        - ExpenseManagerUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
