name: ExpenseManager
options:
  bundleIdPrefix: com.nirmal
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

targets:
  ExpenseManager:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ExpenseManager
    info:
      path: ExpenseManager/Info.plist
    entitlements:
      path: ExpenseManager/ExpenseManager.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nirmal.ExpenseManager
      SWIFT_VERSION: "6.0"
      SWIFT_STRICT_CONCURRENCY: complete
      INFOPLIST_FILE: ExpenseManager/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ENABLE_USER_SCRIPT_SANDBOXING: YES

  ExpenseManagerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ExpenseManager/Tests
    dependencies:
      - target: ExpenseManager

  ExpenseManagerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ExpenseManagerUITests
    dependencies:
      - target: ExpenseManager

schemes:
  ExpenseManager:
    build:
      targets:
        ExpenseManager: all
        ExpenseManagerTests: [test]
        ExpenseManagerUITests: [test]
    test:
      targets:
        - ExpenseManagerTests
        - ExpenseManagerUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
