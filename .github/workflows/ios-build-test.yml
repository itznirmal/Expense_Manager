name: iOS Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
    - uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Build and run unit and UI tests
      run: bash scripts/verify-ios.sh

    - name: Preserve build logs and native test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ios-verification-${{ github.sha }}
        path: build/verification/
        if-no-files-found: warn
